<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voix ElevenLabs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="entete">
    <div class="conteneur">
      <h1>Voix ElevenLabs</h1>
      <p class="sous-titre">Les voix de votre compte, et celles que l'API vous laisse utiliser.</p>
      <form id="form-cle" class="cle" autocomplete="off">
        <label for="cle" class="visuel-cache">Clé API ElevenLabs</label>
        <input id="cle" type="password" placeholder="Clé API (sk_…)" required>
        <label class="case"><input id="memoriser" type="checkbox"> Mémoriser sur ce navigateur</label>
        <button type="submit" id="bouton-charger">Charger les voix</button>
      </form>
      <p id="message" class="message" role="status" hidden></p>
    </div>
  </header>

  <main class="conteneur" id="contenu" hidden>
    <section class="barre-outils" aria-label="Filtres">
      <input id="recherche" type="search" placeholder="Rechercher (nom, description, ID)…">
      <select id="filtre-langue" aria-label="Langue"><option value="">Toutes les langues</option></select>
      <select id="filtre-genre" aria-label="Genre"><option value="">Tous les genres</option></select>
      <label class="case interrupteur"><input id="filtre-api" type="checkbox" checked> Utilisables via l'API uniquement</label>
    </section>

    <section class="test" aria-label="Phrase de test">
      <label for="texte-test">Phrase pour le bouton « Tester »</label>
      <div class="test-ligne">
        <input id="texte-test" type="text" maxlength="200" value="Bonjour, voici un aperçu de ma voix en français.">
        <select id="modele" aria-label="Modèle">
          <option value="eleven_multilingual_v2">Multilingual v2</option>
          <option value="eleven_flash_v2_5">Flash v2.5 (rapide)</option>
          <option value="eleven_v3">v3</option>
        </select>
      </div>
      <p class="aide">Chaque test consomme quelques crédits (≈ un caractère par caractère du texte).</p>
    </section>

    <p id="resume" class="resume"></p>
    <ul id="liste" class="grille"></ul>
    <p id="vide" class="vide" hidden>Aucune voix ne correspond aux filtres.</p>
  </main>

  <template id="modele-carte">
    <li class="carte">
      <div class="carte-haut">
        <div>
          <h2 class="nom"></h2>
          <p class="accroche"></p>
        </div>
        <span class="statut"></span>
      </div>
      <p class="description"></p>
      <ul class="etiquettes"></ul>
      <div class="actions">
        <button type="button" class="ecouter" aria-label="Écouter l'extrait">▶ Extrait</button>
        <button type="button" class="tester">Tester</button>
        <button type="button" class="copier" title="Copier l'ID de la voix">Copier l'ID</button>
      </div>
      <code class="id"></code>
      <p class="retour" hidden></p>
    </li>
  </template>

  <script src="app.js"></script>
</body>
</html>
