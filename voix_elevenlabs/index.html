<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voix ElevenLabs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="entete">
    <div class="conteneur">
      <h1>Voix ElevenLabs</h1>
      <p class="sous-titre">Les voix de votre compte, et celles que l'API vous laisse utiliser.</p>
      <form id="form-cle" class="cle" autocomplete="off">
        <label for="cle" class="visuel-cache">Clé API ElevenLabs</label>
        <input id="cle" type="password" placeholder="Clé API (sk_…)" required>
        <label class="case"><input id="memoriser" type="checkbox"> Mémoriser sur ce navigateur</label>
        <button type="submit" id="bouton-charger">Charger les voix</button>
      </form>
      <p id="message" class="message" role="status" hidden></p>
    </div>
  </header>

  <main class="conteneur" id="contenu" hidden>
    <section class="tts" aria-labelledby="titre-tts">
      <h2 id="titre-tts">Synthèse vocale</h2>
      <label for="texte" class="visuel-cache">Texte à lire</label>
      <textarea id="texte" rows="5" placeholder="Tapez ou collez le texte à lire…">Bonjour ! Ceci est un essai de synthèse vocale en français avec ElevenLabs.</textarea>
      <div class="tts-ligne">
        <label>Voix <select id="voix"></select></label>
        <label>Modèle <select id="modele"></select></label>
        <span id="compteur" class="compteur-car"></span>
      </div>
      <p id="info-modele" class="aide"></p>
      <details class="reglages">
        <summary>Réglages de la voix</summary>
        <div class="curseurs">
          <label>Stabilité <output id="v-stabilite">0.50</output><input id="stabilite" type="range" min="0" max="1" step="0.05" value="0.5"></label>
          <label>Similarité <output id="v-similarite">0.75</output><input id="similarite" type="range" min="0" max="1" step="0.05" value="0.75"></label>
          <label>Style <output id="v-style">0.00</output><input id="style" type="range" min="0" max="1" step="0.05" value="0"></label>
          <label>Vitesse <output id="v-vitesse">1.00</output><input id="vitesse" type="range" min="0.7" max="1.2" step="0.05" value="1"></label>
        </div>
      </details>
      <div class="tts-ligne">
        <button type="button" id="generer" class="principal">Générer l'audio</button>
        <p id="retour-tts" class="retour" role="status" hidden></p>
      </div>
      <ol id="historique" class="historique"></ol>
    </section>

    <h2 class="titre-section">Voix du compte</h2>
    <section class="barre-outils" aria-label="Filtres">
      <input id="recherche" type="search" placeholder="Rechercher (nom, description, ID)…">
      <select id="filtre-langue" aria-label="Langue"><option value="">Toutes les langues</option></select>
      <select id="filtre-genre" aria-label="Genre"><option value="">Tous les genres</option></select>
      <label class="case interrupteur"><input id="filtre-api" type="checkbox" checked> Utilisables via l'API uniquement</label>
    </section>


    <p id="resume" class="resume"></p>
    <ul id="liste" class="grille"></ul>
    <p id="vide" class="vide" hidden>Aucune voix ne correspond aux filtres.</p>
  </main>

  <template id="modele-carte">
    <li class="carte">
      <div class="carte-haut">
        <div>
          <h2 class="nom"></h2>
          <p class="accroche"></p>
        </div>
        <span class="statut"></span>
      </div>
      <p class="description"></p>
      <ul class="etiquettes"></ul>
      <div class="actions">
        <button type="button" class="ecouter" aria-label="Écouter l'extrait">▶ Extrait</button>
        <button type="button" class="choisir">Choisir</button>
        <button type="button" class="copier" title="Copier l'ID de la voix">Copier l'ID</button>
      </div>
      <code class="id"></code>
      <p class="retour" hidden></p>
    </li>
  </template>

  <script src="app.js"></script>
</body>
</html>
