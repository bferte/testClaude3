# =====================================================================
#  Format ECHO – catalogue audition (CSV « ; » à enregistrements typés)
#  Chaque ligne commence par un code d'enregistrement (00, 01, 03, 20, 81...).
#  Les champs sont nommés comme les colonnes de l'export Excel du même
#  fournisseur : le profil « Audition » s'applique donc tel quel.
#
#  Correspondance établie en croisant un fichier ECHO et l'export Excel
#  du même catalogue (juin 2026). Les positions marquées « (?) » étaient
#  vides dans ce fichier : leur signification n'a pas pu être vérifiée.
# =====================================================================
nom: ECHO audition
detection:
  premier_enregistrement: "00"
  enregistrements_attendus: ["20", "81"]

enregistrements:
  "00":
    role: entete
    champs: {1: Version, 2: Année, 3: Date du fichier, 4: Nom du catalogue, 5: Devise, 7: Nombre de contrôle}
  "01":
    role: entete
    champs: {1: Code fabricant, 2: Nom du fabricant, 3: Adresse, 4: Code postal, 5: Ville, 6: Pays, 7: Type}
  "02":
    role: entete
    champs: {1: Code du distributeur, 2: Nom du distributeur, 3: Adresse, 4: Code postal, 5: Ville, 6: Pays, 7: Type}
  "03":
    role: referentiel
    onglet: Marques
    champs: {1: Code marque, 2: Nom de la marque}

  # --- Audioprothèses : un enregistrement 20 par modèle, un 81 par déclinaison couleur ---
